# DolRecomp self-modifying-code flags for S2LE01 main.dol, reviewed by hand.
# kind: store-false-positive = ordinary store through a pointer argument; DolRecomp's
#   constant tracker carried a stale base register across a blr into the next function.
# kind: cache-maintenance = icbi in SDK cache flush/invalidate code; changes no code.
# patch = what Wonderpark does about it. tools/recomp.py fails on any flag not listed here.

[[flag]]
address = 0x800043AC
instruction = "icbi 0, r5"
kind = "cache-maintenance"
patch = "none"

